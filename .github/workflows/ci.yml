name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: demoledger_owner
          POSTGRES_PASSWORD: demoledger_owner_dev_pw
          # Tests only use demoledger_test (see vitest.shared.ts).
          POSTGRES_DB: demoledger_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U demoledger_owner -d demoledger_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Placeholders matching .env.example; no provider credentials in CI.
      POSTGRES_USER: demoledger_owner
      POSTGRES_PASSWORD: demoledger_owner_dev_pw
      LEDGER_READER_PASSWORD: ledger_reader_dev_pw
      LEDGER_APP_PASSWORD: ledger_app_dev_pw
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo-map --check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
