<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 624" width="968" height="624" role="img" aria-labelledby="data-model-title data-model-desc">
<title id="data-model-title">Data model, roles and RLS</title>
<desc id="data-model-desc">Entity diagram of organization (the tenant), user, member, session, transactions, the audit tables and the conversation tables, with each table&#x27;s database role access and which tables have forced row-level security.</desc>
<style>
.bg{fill:#f7f6f3}.mask{fill:#f7f6f3}.box{fill:#ffffff;stroke:#121212}.box2{fill:#ffffff;stroke:#8a8882}
.focal{fill:#fbf2f3;stroke:#b3001b}.ink{fill:#121212}.muted{fill:#5c5c5c}.acc{fill:#b3001b}.lnk{fill:#146c2e}
.s-muted{stroke:#5c5c5c}.s-acc{stroke:#b3001b}.s-lnk{stroke:#146c2e}.s-ink{stroke:#121212}.s-rule{stroke:#e2e0da}
.s-tag{stroke:#8a8882}.life{stroke:#b9b7b1}.frame{fill:#f2f1ed;stroke:#c9c7c1}.act{fill:#e7e5e0;stroke:#5c5c5c}
.row{fill:#ffffff}.row-alt{fill:#faf9f7}.none{fill:none}
.sans{font-family:"Hedvig Letters Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){
.bg{fill:#121212}.mask{fill:#121212}.box{fill:#1c1c1c;stroke:#fafafa}.box2{fill:#1c1c1c;stroke:#6b6b6b}
.focal{fill:#2a1518;stroke:#ff7a8a}.ink{fill:#fafafa}.muted{fill:#a3a3a3}.acc{fill:#ff7a8a}.lnk{fill:#6fd08c}
.s-muted{stroke:#a3a3a3}.s-acc{stroke:#ff7a8a}.s-lnk{stroke:#6fd08c}.s-ink{stroke:#fafafa}.s-rule{stroke:#2e2e2e}
.s-tag{stroke:#6b6b6b}.life{stroke:#4a4a4a}.frame{fill:#171717;stroke:#3a3a3a}.act{fill:#262626;stroke:#a3a3a3}
.row{fill:#1c1c1c}.row-alt{fill:#161616}
}
</style>
