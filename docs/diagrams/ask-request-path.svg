<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 904" width="968" height="904" role="img" aria-labelledby="ask-request-path-title ask-request-path-desc">
<title id="ask-request-path-title">/api/ask request path</title>
<desc id="ask-request-path-desc">Sequence of one assistant question: API middleware establishes the tenant, the guard and stored history run first, the model calls tenant-scoped tools against Postgres under RLS, the answer is checked, streamed to the browser and audited.</desc>
